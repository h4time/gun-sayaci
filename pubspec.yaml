name: gun_sayaci
description: "Özel günlerinize geri sayım yapın. Doğum günü, bayram, yıldönümü ve daha fazlası."
publish_to: 'none'
version: 2.0.0+33

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  hive_generator: ^2.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  intl: ^0.20.2
  provider: ^6.1.2
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  shared_preferences: ^2.3.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  percent_indicator: ^4.2.5
  package_info_plus: ^9.0.1
  file_picker: ^11.0.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  purchases_flutter: ^9.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_light.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/birthday.jpg
    - assets/images/celebration.jpg
    - assets/images/travel.jpg
    - assets/images/exam.jpg
    - assets/images/seyahat.jpg
    - assets/images/other.jpg
    - assets/images/spor.jpg
    - assets/images/concert.jpg
    - assets/images/developer.jpg
    - assets/images/reklam-banner.png
    - assets/images/logo_transparent.png
    - assets/icons/app_icon_light.png
    - assets/icons/app_icon_dark.png
    - assets/icons/cake.png
    - assets/icons/beach.png
    - assets/icons/task.png
    - assets/icons/travel-bag.png
    - assets/icons/icon_white.png
    - assets/icons/icon_dark.png
    - assets/icons/icon_pink_purple.png
    - assets/icons/icon_pink.png
    - assets/icons/icon_amber.png
    - assets/icons/icon_mint.png
    - assets/icons/icon_blue.png
    - assets/icons/icon_orange_bold.png
    - assets/icons/icon_lavender.png
    - assets/icons/icon_party.png
    - assets/icons/icon_teal_calendar.png
    - assets/icons/cat_holiday.png
    - assets/category_themes/birthday/
    - assets/category_themes/holiday/
    - assets/category_themes/wedding/
    - assets/category_themes/exam/
    - assets/category_themes/travel/
    - assets/category_themes/concert/
    - assets/category_themes/sport/
    - assets/category_themes/other/
